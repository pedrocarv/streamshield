<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="heading">
      <div class="shield" aria-hidden="true">S</div>
      <div>
        <h1>StreamShield</h1>
        <p id="summary">Checking this page…</p>
      </div>
    </div>
    <div class="control">
      <div>
        <strong>Protection</strong>
        <span id="hostname">Current site</span>
      </div>
      <label class="switch">
        <input id="enabled" type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="control secondary">
      <div>
        <strong>Strict pop-up blocking</strong>
        <span>Use only on troublesome sites</span>
      </div>
      <label class="switch">
        <input id="strict" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>
    <p class="note">Balanced mode allows legitimate new windows while blocking known ad and redirect destinations. Strict mode blocks all cross-site pop-ups on this site.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
